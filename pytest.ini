[pytest]
# Repo-root pytest configuration.
#
# The application tests live under `backend/tests` (they import the `app`
# package) and the chatbot tests live under `chatagent/chatbot/tests` (they
# import the `chatagent` package). Both trees are discovered from a single run,
# and `pythonpath` (relative to this rootdir) makes `app` and `chatagent`
# importable regardless of the directory pytest is invoked from.
pythonpath = backend .
testpaths = backend/tests chatagent/chatbot/tests
